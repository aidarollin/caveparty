<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass the Aux</title>
  <meta name="description" content="One device plays the music. Everyone at the party adds and reorders the songs.">
  <meta name="theme-color" content="#0A0A0B">
  <script>
    // Pick light or dark before the first paint. A choice saved on this device wins over the system setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem('pta-theme'); } catch (e) { /* storage unavailable */ }
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231ED760'/%3E%3Cpath d='M25 19v26l21-13z' fill='%23000'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"><div id="backdrop-art"></div></div>
  <div id="app"><p class="boot">Getting the party ready</p></div>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/sortable.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
