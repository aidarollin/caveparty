<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cave Party</title>
  <meta name="description" content="Share the aux. One speaker, everyone's queue.">
  <meta name="theme-color" content="#0D1140">
  <script>
    // Pick light or dark before the first paint. A choice saved on this device wins over the system setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem('pta-theme'); } catch (e) { /* storage unavailable */ }
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"><div id="backdrop-art"></div></div>
  <div id="app"><p class="boot">Getting the party ready</p></div>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/sortable.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="music-color.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
