<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cave Party</title>
  <meta name="description" content="Share the aux. One speaker, everyone's queue.">
  <meta name="theme-color" content="#0A0A0B">
  <script>
    // Set the theme before the first paint. A choice saved on this device wins: the palette (classic unless one
    // was picked) and the mode, which follows the system setting until someone picks one. Two palettes have one look.
    (function () {
      var known = { classic: 1, mint: 1, app: 1, market: 1 }, oneLook = { app: 1, market: 1 }, mode = null, palette = null;
      try { mode = localStorage.getItem('pta-theme'); palette = localStorage.getItem('pta-palette'); } catch (e) { /* storage unavailable */ }
      if (!known[palette]) palette = 'classic';
      if (mode !== 'light' && mode !== 'dark') mode = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      if (oneLook[palette]) mode = 'dark';
      document.documentElement.dataset.palette = palette;
      document.documentElement.dataset.theme = mode;
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"><div id="backdrop-art"></div></div>
  <div id="app"><p class="boot">Getting the party ready</p></div>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/sortable.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="music-color.js"></script>
  <script src="avatars.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
